name: Refresh Gold Mine live data

on:
  workflow_dispatch:
  # Backup/history only. Cloudflare Worker is the primary true-live source.
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_live_data.py'
      - 'scripts/merge_headline_continuity.py'
      - 'scripts/enrich_official_data.py'
      - 'scripts/enrich_fed_minutes.py'
      - 'scripts/apply_signal_policy.py'
      - 'scripts/enrich_xau_technicals.py'
      - 'scripts/generate_trade_signals.py'
      - 'scripts/normalize_trade_signal.py'
      - 'scripts/record_signal_history.py'
      - 'scripts/record_trade_setup_history.py'
      - 'data/policy-history.json'
      - 'data/trade-setup-history.json'
      - '.github/workflows/refresh-live-data.yml'

permissions:
  contents: write

concurrency:
  group: gold-mine-live-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Preserve previous snapshot for continuity
        run: cp live-data.json /tmp/previous-live-data.json 2>/dev/null || true
      - name: Refresh calendar, market and headline snapshot
        run: python3 scripts/refresh_live_data.py
      - name: Preserve recent headlines if public feeds temporarily thin
        run: python3 scripts/merge_headline_continuity.py /tmp/previous-live-data.json live-data.json
      - name: Enrich major releases from official BLS/Fed sources
        run: python3 scripts/enrich_official_data.py
      - name: Follow official Fed minutes documents
        run: python3 scripts/enrich_fed_minutes.py
      - name: Apply medium-high and historical signal policy
        run: python3 scripts/apply_signal_policy.py
      - name: Enrich free XAUUSD price, structure and order blocks
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          OANDA_ENV: ${{ secrets.OANDA_ENV }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: python3 scripts/enrich_xau_technicals.py
      - name: Generate strict buy/sell limit Signals
        run: python3 scripts/generate_trade_signals.py
      - name: Record macro signal outcomes
        run: python3 scripts/record_signal_history.py
      - name: Record technical setup outcomes
        run: python3 scripts/record_trade_setup_history.py
      - name: Commit changed live data
        run: |
          if git diff --quiet -- live-data.json data/signal-history.json data/policy-history.json data/trade-setup-history.json; then
            echo "No material live-data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live-data.json data/signal-history.json data/policy-history.json data/trade-setup-history.json
          git commit -m "Refresh Gold Mine live data"
          git push origin main
