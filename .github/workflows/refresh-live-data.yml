name: Refresh Gold Mine live data

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_live_data.py'
      - '.github/workflows/refresh-live-data.yml'

permissions:
  contents: write

concurrency:
  group: gold-mine-live-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Refresh free calendar, news and market data
        run: python3 scripts/refresh_live_data.py
      - name: Commit data only when it changed
        run: |
          if git diff --quiet -- live-data.json; then
            echo "No material live-data change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live-data.json
          git commit -m "Refresh Gold Mine live data"
          git push origin main
