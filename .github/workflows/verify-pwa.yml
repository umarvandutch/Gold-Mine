name: Verify Gold Mine PWA

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'live.css'
      - 'app.js'
      - 'config.js'
      - 'refresh-fix.js'
      - 'pull-refresh.js'
      - 'gold-direction-labels.js'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icons/**'
      - 'scripts/**'
      - 'worker/**'
      - '.github/workflows/verify-pwa.yml'
      - '.github/workflows/refresh-live-data.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check config.js
          node --check refresh-fix.js
          node --check pull-refresh.js
          node --check gold-direction-labels.js
          node --input-type=module --check < worker/src/index.js
      - name: Validate live data refresher
        run: python3 -m py_compile scripts/refresh_live_data.py
      - name: Validate manifest
        run: node -e "const m=JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); if(!m.name||!m.start_url||!m.icons?.length) process.exit(1)"
      - name: Verify required files
        run: test -f index.html && test -f styles.css && test -f live.css && test -f app.js && test -f config.js && test -f refresh-fix.js && test -f pull-refresh.js && test -f gold-direction-labels.js && test -f sw.js && test -f worker/src/index.js && test -f worker/wrangler.toml && test -f icons/icon-192.png && test -f icons/icon-512.png
