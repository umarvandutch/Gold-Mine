name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Gold-Mine.apk

      - name: Upload Gold Mine APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gold-Mine-APK
          path: Gold-Mine.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK as GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view apk-v1.0.0 >/dev/null 2>&1; then
            gh release upload apk-v1.0.0 Gold-Mine.apk --clobber
          else
            gh release create apk-v1.0.0 Gold-Mine.apk \
              --target "$GITHUB_SHA" \
              --title "Gold Mine Android APK v1.0.0" \
              --notes "Standalone Android release APK for Gold Mine. JavaScript is bundled inside the app, so no Metro development server is required. Live market feeds are not yet connected."
          fi
