name: Deploy Gold Mine PWA

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'live.css'
      - 'app.js'
      - 'config.js'
      - 'bootstrap-live.js'
      - 'refresh-fix.js'
      - 'pull-refresh.js'
      - 'adaptive-refresh.js'
      - 'gold-direction-labels.js'
      - 'official-signal-layer.js'
      - 'accuracy-engine.js'
      - 'decision-engine-v4.js'
      - 'app-fixes-v1.js'
      - 'trade-plan-fixes.js'
      - 'chart-resume-fix.js'
      - 'live-ui-v3.js'
      - 'live-refresh-v2.js'
      - 'signals-engine.js'
      - 'signals-engine-v2.js'
      - 'notification-test.js'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icons/**'
      - '.nojekyll'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gold-mine-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify static app
        run: |
          node --check app.js
          node --check config.js
          node --check bootstrap-live.js
          node --check refresh-fix.js
          node --check pull-refresh.js
          node --check adaptive-refresh.js
          node --check gold-direction-labels.js
          node --check official-signal-layer.js
          node --check accuracy-engine.js
          node --check decision-engine-v4.js
          node --check app-fixes-v1.js
          node --check trade-plan-fixes.js
          node --check chart-resume-fix.js
          node --check live-ui-v3.js
          node --check live-refresh-v2.js
          node --check signals-engine.js
          node --check signals-engine-v2.js
          node --check notification-test.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/icons
          cp index.html styles.css live.css app.js config.js bootstrap-live.js refresh-fix.js pull-refresh.js adaptive-refresh.js gold-direction-labels.js official-signal-layer.js accuracy-engine.js decision-engine-v4.js app-fixes-v1.js trade-plan-fixes.js chart-resume-fix.js live-ui-v3.js live-refresh-v2.js signals-engine.js signals-engine-v2.js notification-test.js manifest.webmanifest sw.js .nojekyll _site/
          cp icons/icon-192.png icons/icon-512.png _site/icons/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
