name: Deploy Gold Mine PWA

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'live.css'
      - 'app.js'
      - 'config.js'
      - 'refresh-fix.js'
      - 'pull-refresh.js'
      - 'gold-direction-labels.js'
      - 'accuracy-engine.js'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icons/**'
      - '.nojekyll'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gold-mine-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify static app
        run: |
          node --check app.js
          node --check config.js
          node --check refresh-fix.js
          node --check pull-refresh.js
          node --check gold-direction-labels.js
          node --check accuracy-engine.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/icons
          cp index.html styles.css live.css app.js config.js refresh-fix.js pull-refresh.js gold-direction-labels.js accuracy-engine.js manifest.webmanifest sw.js .nojekyll _site/
          cp icons/icon-192.png icons/icon-512.png _site/icons/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
