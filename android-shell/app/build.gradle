plugins { id "com.android.application" }

android {
  namespace "com.goldmine.shell"
  compileSdk 35
  defaultConfig { applicationId "com.goldmine.shell"; minSdk 24; targetSdk 35; versionCode 4; versionName "1.2.0" }
  buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
  implementation "androidx.core:core:1.15.0"
  implementation "androidx.work:work-runtime:2.10.0"
}
